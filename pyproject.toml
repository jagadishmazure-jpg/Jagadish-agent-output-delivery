[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jagadish-agent-output-delivery"
version = "0.1.0"
description = "First-class output delivery for agent results: chat, table, report, email"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
